[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arabic-reshaper>=3.1.0",
    "fastapi[standard]>=0.142.2",
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "pillow>=13.0.0",
    "psutil>=7.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-bidi>=0.6.12",
    "python-multipart>=0.0.32",
    "socksio>=1.0.0",
    "sqlalchemy>=2.1.3",
]
[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
