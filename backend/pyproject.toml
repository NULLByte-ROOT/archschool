[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "passlib>=1.7.4",
    "psutil>=7.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.3",
]
[tool.fastapi]
entrypoint = "app.main:app"
