server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend enforces 25 MB (MAX_UPLOAD_MB). Nginx is set slightly higher so
    # the multipart overhead (boundaries + headers) never trips the limit.
    client_max_body_size 30m;
    client_body_timeout 300s;

    # WebSocket endpoint (chat) — needs the upgrade headers.
    location ^~ /api/ws {
        proxy_pass http://archschool_backend:8000/api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # REST API + uploaded media (/api/media/...).
    # `^~` stops any regex location (e.g. a host-level `\.(jpg|png)$` static
    # cache rule) from hijacking image requests away from the backend.
    location ^~ /api/ {
        proxy_pass http://archschool_backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
